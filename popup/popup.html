<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="text-scale" content="scale">
    <title>Microburbs Facts</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../consts.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon-128.png" width="32" height="32" alt="">
        <h1>Microburbs Facts</h1>
      </header>
      <div class="actions">
        <button id="open-options" type="button">Open options</button>
        <button id="open-side-panel" type="button" disabled>Open side panel</button>
        <button id="show-widget" type="button">Show page widget</button>
      </div>
      <section class="notepad">
        <h2>Notepad</h2>
        <form id="note-form" action="popup.html" method="post">
          <label for="note-text">New note (required)</label>
          <textarea id="note-text" name="note" rows="3" required></textarea>
          <button id="save-note" type="submit">Save note</button>
        </form>
        <h3>Saved notes</h3>
        <p id="notes-empty">Loading notes…</p>
        <ul id="notes-list" aria-label="Saved notes" hidden></ul>
      </section>
      <p id="status" role="status" aria-atomic="true"></p>
    </main>
  </body>
</html>
